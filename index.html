<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>64괘 학습 가이드 App</title>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const BAGUA_DATA = {
      건: {
        name: '건', hanja: '乾', symbol: '☰', nature: '천(天) · 하늘',
        lines: [1, 1, 1],
        family: '父(부) · 아버지',
        familyShort: '父',
        familyReason: '세 효가 모두 양효인 순양(純陽)의 괘이므로 아버지에 배속합니다.',

        element: '金(금)',

        familyReason: '유일한 양효가 가운데(2효)에 있으므로 中男(중남)에 배속합니다.',
        highlightLine: 1,
        element: '水(수)',
        direction: '北(북)',
        keyword: '험함 · 빠짐'
      },
      간: {
        name: '간', hanja: '艮', symbol: '☶', nature: '산(山) · 산',
        lines: [0, 0, 1],
        family: '少男(소남) · 막내아들',
        familyShort: '少男',
        familyReason: '유일한 양효가 위(3효)에 있으므로 少男(소남)에 배속합니다.',
        highlightLine: 2,
        element: '土(토)',
        direction: '東北(동북)',
        keyword: '멈춤 · 그침'
      },
      곤: {
        name: '곤', hanja: '坤', symbol: '☷', nature: '지(地) · 땅',
        lines: [0, 0, 0],
        family: '母(모) · 어머니',
        familyShort: '母',
        familyReason: '세 효가 모두 음효인 순음(純陰)의 괘이므로 어머니에 배속합니다.',
        highlightLine: null,
        element: '土(토)',
        direction: '西南(서남)',
        keyword: '유순 · 포용'
      }
    };

    const HEXAGRAM_MASTER = [
      [1, '건위천', '乾爲天', '건', '건'],
      [2, '곤위지', '坤爲地', '곤', '곤'],
      [3, '수뢰둔', '水雷屯', '감', '진'],
      [4, '산수몽', '山水蒙', '간', '감'],
      [5, '수천수', '水天需', '감', '건'],
      [6, '천수송', '天水訟', '건', '감'],
      [7, '지수사', '地水師', '곤', '감'],
      [8, '수지비', '水地比', '감', '곤'],
      [9, '풍천소축', '風天小畜', '손', '건'],
      [10, '천택리', '天澤履', '건', '태'],
      [11, '지천태', '地天泰', '곤', '건'],
      [12, '천지비', '天地否', '건', '곤'],
      [13, '천화동인', '天火同人', '건', '리'],
      [14, '화천대유', '火天大有', '리', '건'],
      [15, '지산겸', '地山謙', '곤', '간'],
      [16, '뇌지예', '雷地豫', '진', '곤'],
      [17, '택뢰수', '澤雷隨', '태', '진'],
      [18, '산풍고', '山風蠱', '간', '손'],
      [19, '지택림', '地澤臨', '곤', '태'],
      [20, '풍지관', '風地觀', '손', '곤'],
      [21, '화뢰서합', '火雷噬嗑', '리', '진'],
      [22, '산화비', '山火賁', '간', '리'],
      [23, '산지박', '山地剝', '간', '곤'],
      [24, '지뢰복', '地雷復', '곤', '진'],
      [25, '천뢰무망', '天雷无妄', '건', '진'],
      [26, '산천대축', '山天大畜', '간', '건'],
      [27, '산뢰이', '山雷頤', '간', '진'],
      [28, '택풍대과', '澤風大過', '태', '손'],
      [29, '감위수', '坎爲水', '감', '감'],
      [30, '이위화', '離爲火', '리', '리'],
      [31, '택산함', '澤山咸', '태', '간'],
      [32, '뇌풍항', '雷風恒', '진', '손'],
      [33, '천산돈', '天山遯', '건', '간'],
      [34, '뇌천대장', '雷天大壯', '진', '건'],
      [35, '화지진', '火地晉', '리', '곤'],
      [36, '지화명이', '地火明夷', '곤', '리'],
      [37, '풍화가인', '風火家人', '손', '리'],
      [38, '화택규', '火澤睽', '리', '태'],
      [39, '수산건', '水山蹇', '감', '간'],
      [40, '뇌수해', '雷水解', '진', '감'],
      [41, '산택손', '山澤損', '간', '태'],
      [42, '풍뢰익', '風雷益', '손', '진'],
      [43, '택천쾌', '澤天夬', '태', '건'],
      [44, '천풍구', '天風姤', '건', '손'],
      [45, '택지췌', '澤地萃', '태', '곤'],
      [46, '지풍승', '地風升', '곤', '손'],
      [47, '택수곤', '澤水困', '태', '감'],
      [48, '수풍정', '水風井', '감', '손'],
      [49, '택화혁', '澤火革', '태', '리'],
      [50, '화풍정', '火風鼎', '리', '손'],
      [51, '진위뢰', '震爲雷', '진', '진'],
      [52, '간위산', '艮爲山', '간', '간'],
      [53, '풍산점', '風山漸', '손', '간'],
      [54, '뇌택귀매', '雷澤歸妹', '진', '태'],
      [55, '뇌화풍', '雷火豐', '진', '리'],
      [56, '화산려', '火山旅', '리', '간'],
      [57, '손위풍', '巽爲風', '손', '손'],
      [58, '태위택', '兌爲澤', '태', '태'],
      [59, '풍수환', '風水渙', '손', '감'],
      [60, '수택절', '水澤節', '감', '태'],
      [61, '풍택중부', '風澤中孚', '손', '태'],
      [62, '뇌산소과', '雷山小過', '진', '간'],
      [63, '수화기제', '水火既濟', '감', '리'],
      [64, '화수미제', '火水未濟', '리', '감']
    ];

    const generateInitial64Gwa = () =>
      HEXAGRAM_MASTER.map(([id, nameHangul, nameHanja, upperGwa, lowerGwa]) => ({
        id,
        nameHangul,
        nameHanja,
        symbol: String.fromCodePoint(0x4DC0 + id - 1),
        upperGwa,
        lowerGwa,
        meaning: '',
        isLearned: false,
        isFavorite: false,
        wrongCount: 0,
        gwaesa: '',
        hyosa: ['', '', '', '', '', ''],
        interpretation: '',
        memo: ''
      }));

    function TrigramLines({ item, compact = false }) {
      const displayLines = [2, 1, 0];

      return (
        <div style={{
          width: compact ? '62px' : '110px',
          margin: '0 auto',
          display: 'flex',
          flexDirection: 'column',
          gap: compact ? '5px' : '8px'
        }}>
          {displayLines.map((lineIndex) => {
            const isYang = item.lines[lineIndex] === 1;
            const highlighted = item.highlightLine === lineIndex;

            return (
              <div
                key={lineIndex}
                style={{
                  display: 'flex',
                  gap: compact ? '5px' : '8px',
                  alignItems: 'center',
                  justifyContent: 'center',
                  padding: highlighted ? '3px 5px' : '3px',
                  borderRadius: '6px',
                  background: highlighted ? '#fff3cd' : 'transparent',
                  border: highlighted ? '1px solid #f0ad4e' : '1px solid transparent'
                }}
              >
                {isYang ? (
                  <div style={{
                    height: compact ? '4px' : '6px',
                    width: '100%',
                    background: '#222',
                    borderRadius: '3px'
                  }} />
                ) : (
                  <>
                    <div style={{
                      height: compact ? '4px' : '6px',
                      width: '43%',
                      background: '#222',
                      borderRadius: '3px'
                    }} />
                    <div style={{
                      height: compact ? '4px' : '6px',
                      width: '43%',
                      background: '#222',
                      borderRadius: '3px'
                    }} />
                  </>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function App() {
      const [currentTab, setCurrentTab] = useState('home');
      const [gwaData, setGwaData] = useState(generateInitial64Gwa());
      const [selectedGwaId, setSelectedGwaId] = useState(null);

      const [userHistory, setUserHistory] = useState({
        solvedCorrect: [],
        solvedWrong: [],
        wrongGwaIds: []
      });

      const toggleLearned = (id) => {
        setGwaData(prev =>
          prev.map(item =>
            item.id === id ? { ...item, isLearned: !item.isLearned } : item
          )
        );
      };

      const toggleFavorite = (id) => {
        setGwaData(prev =>
          prev.map(item =>
            item.id === id ? { ...item, isFavorite: !item.isFavorite } : item
          )
        );
      };

      const renderContent = () => {
        switch (currentTab) {
          case 'home':
            return <HomeView setTab={setCurrentTab} gwaData={gwaData} />;
          case 'bagua':
            return <BaguaView />;
          case 'hexagrams':
            return selectedGwaId ? (
              <GwaDetailView
                gwa={gwaData.find(g => g.id === selectedGwaId)}
                onBack={() => setSelectedGwaId(null)}
                toggleLearned={toggleLearned}
                toggleFavorite={toggleFavorite}
              />
            ) : (
              <HexagramListView
                gwaData={gwaData}
                onSelectGwa={setSelectedGwaId}
              />
            );
          case 'quiz':
            return (
              <QuizView
                gwaData={gwaData}
                setUserHistory={setUserHistory}
              />
            );
          case 'history':
            return (
              <HistoryView
                gwaData={gwaData}
                userHistory={userHistory}
              />
            );
          default:
            return <HomeView setTab={setCurrentTab} gwaData={gwaData} />;
        }
      };

      return (
        <div style={{
          maxWidth: '500px',
          margin: '0 auto',
          fontFamily: 'sans-serif',
          padding: '16px',
          background: '#f9f9f9',
          minHeight: '100vh',
          boxShadow: '0 0 20px rgba(0,0,0,0.1)'
        }}>
          <header style={{
            borderBottom: '2px solid #333',
            paddingBottom: '8px',
            marginBottom: '16px'
          }}>
            <h1 style={{ fontSize: '20px', margin: 0 }}>
              ☯️ 64괘 학습 가이드
            </h1>
          </header>

          <nav style={{
            display: 'flex',
            gap: '4px',
            marginBottom: '16px',
            flexWrap: 'wrap'
          }}>
            {['home', 'bagua', 'hexagrams', 'quiz', 'history'].map((tab) => {
              const labels = {
                home: '홈',
                bagua: '팔괘 학습',
                hexagrams: '64괘 학습',
                quiz: '퀴즈',
                history: '학습기록'
              };

              return (
                <button
                  key={tab}
                  onClick={() => {
                    setCurrentTab(tab);
                    setSelectedGwaId(null);
                  }}
                  style={{
                    flex: 1,
                    padding: '8px 4px',
                    fontSize: '12px',
                    cursor: 'pointer',
                    backgroundColor: currentTab === tab ? '#333' : '#fff',
                    color: currentTab === tab ? '#fff' : '#333',
                    border: '1px solid #ccc',
                    borderRadius: '4px'
                  }}
                >
                  {labels[tab]}
                </button>
              );
            })}
          </nav>

          <main style={{
            background: '#fff',
            padding: '16px',
            borderRadius: '8px',
            border: '1px solid #ddd'
          }}>
            {renderContent()}
          </main>
        </div>
      );
    }

    function HomeView({ setTab, gwaData }) {
      const learnedCount = gwaData.filter(g => g.isLearned).length;

      return (
        <div>
          <h3>주역 공부 시작하기</h3>
          <p style={{ color: '#555', fontSize: '14px', lineHeight: '1.5' }}>
            팔괘의 원리를 이해하고, 상괘·하괘의 조합으로 64괘를 익혀보세요.
          </p>

          <div style={{
            background: '#eee',
            padding: '12px',
            borderRadius: '6px',
            margin: '16px 0'
          }}>
            <strong>64괘 현재 진도:</strong>{' '}
            {learnedCount} / {gwaData.length} 완료
            {' '}({Math.round((learnedCount / gwaData.length) * 100)}%)
          </div>

          <button
            onClick={() => setTab('bagua')}
            style={{
              width: '100%',
              padding: '12px',
              marginBottom: '8px',
              background: '#333',
              color: '#fff',
              border: 'none',
              borderRadius: '4px',
              cursor: 'pointer',
              fontWeight: 'bold'
            }}
          >
            ① 팔괘 원리부터 보기 →
          </button>

          <button
            onClick={() => setTab('hexagrams')}
            style={{
              width: '100%',
              padding: '12px',
              background: '#0066cc',
              color: '#fff',
              border: 'none',
              borderRadius: '4px',
              cursor: 'pointer',
              fontWeight: 'bold'
            }}
          >
            ② 실제 64괘 전체 보기 →
          </button>
        </div>
      );
    }

    function BaguaView() {
      const [selectedBagua, setSelectedBagua] = useState(null);

      if (selectedBagua) {
        const item = BAGUA_DATA[selectedBagua];

        return (
          <div>
            <button
              onClick={() => setSelectedBagua(null)}
              style={{ marginBottom: '12px', cursor: 'pointer', padding: '6px 12px', borderRadius: '4px', border: '1px solid #ccc', background: '#fff' }}
            >
              ← 팔괘 목록
            </button>

            <div style={{
              border: '1px solid #ddd',
              borderRadius: '10px',
              padding: '18px'
            }}>
              <div style={{ textAlign: 'center' }}>
                <div style={{ fontSize: '58px', lineHeight: 1 }}>
                  {item.symbol}
                </div>

                <h2 style={{ marginBottom: '6px' }}>
                  {item.hanja}({item.name})
                </h2>

                <div style={{ color: '#666', marginBottom: '18px' }}>
                  {item.nature} · {item.keyword}
                </div>

                <TrigramLines item={item} />

                {item.highlightLine !== null && (
                  <div style={{
                    marginTop: '10px',
                    fontSize: '12px',
                    color: '#9a6700'
                  }}>
                    노란색으로 표시된 효가 가족 배속을 결정하는 효입니다.
                  </div>
                )}
              </div>

              <div style={{
                marginTop: '20px',
                display: 'grid',
                gap: '8px'
              }}>
                <InfoRow label="가족" value={item.family} />
                <InfoRow label="자연" value={item.nature} />
                <InfoRow label="오행" value={item.element} />
                <InfoRow label="방위" value={item.direction} />
                <InfoRow label="기본 의미" value={item.keyword} />
              </div>

              <div style={{
                marginTop: '16px',
                padding: '14px',
                background: '#fff8e1',
                border: '1px solid #ffe08a',
                borderRadius: '8px',
                lineHeight: 1.6
              }}>
                <strong>왜 {item.familyShort}일까?</strong>
                <div style={{ marginTop: '6px' }}>
                  {item.familyReason}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div>
          <h3>팔괘(八卦) 원리 학습</h3>

          <div style={{
            background: '#f6f6f6',
            padding: '10px',
            borderRadius: '6px',
            marginBottom: '14px',
            fontSize: '13px',
            lineHeight: 1.6
          }}>
            남자 괘는 <strong>양효 하나의 위치</strong>,
            여자 괘는 <strong>음효 하나의 위치</strong>를 보면
            長·中·少를 쉽게 구분할 수 있습니다.
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(2, 1fr)',
            gap: '8px'
          }}>
            {Object.entries(BAGUA_DATA).map(([key, item]) => (
              <button
                key={key}
                onClick={() => setSelectedBagua(key)}
                style={{
                  border: '1px solid #ddd',
                  padding: '12px 8px',
                  borderRadius: '8px',
                  textAlign: 'center',
                  background: '#fff',
                  cursor: 'pointer'
                }}
              >
                <div style={{ fontSize: '34px' }}>{item.symbol}</div>
                <div>
                  <strong>{item.hanja}({item.name})</strong>
                </div>
                <div style={{
                  fontSize: '12px',
                  color: '#555',
                  marginTop: '4px'
                }}>
                  {item.nature}
                </div>
                <div style={{
                  fontSize: '12px',
                  marginTop: '5px',
                  fontWeight: 'bold'
                }}>
                  {item.familyShort}
                </div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function InfoRow({ label, value }) {
      return (
        <div style={{
          display: 'grid',
          gridTemplateColumns: '80px 1fr',
          gap: '8px',
          padding: '8px 10px',
          background: '#f7f7f7',
          borderRadius: '6px',
          fontSize: '14px'
        }}>
          <strong>{label}</strong>
          <span>{value}</span>
        </div>
      );
    }

    function HexagramListView({ gwaData, onSelectGwa }) {
      return (
        <div>
          <h3>주역 64괘 · 문왕괘서</h3>

          <div style={{
            fontSize: '12px',
            color: '#666',
            marginBottom: '12px'
          }}>
            임시 조합번호가 아니라 실제 1괘 乾爲天부터 64괘 火水未濟까지의 순서입니다.
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(4, 1fr)',
            gap: '8px'
          }}>
            {gwaData.map(gwa => (
              <div
                key={gwa.id}
                onClick={() => onSelectGwa(gwa.id)}
                style={{
                  border: gwa.isLearned
                    ? '2px solid #4CAF50'
                    : '1px solid #ccc',
                  padding: '8px 4px',
                  borderRadius: '6px',
                  textAlign: 'center',
                  cursor: 'pointer',
                  background: gwa.isFavorite ? '#fffde7' : '#fff'
                }}
              >
                <div style={{
                  fontSize: '10px',
                  color: '#888'
                }}>
                  No.{gwa.id}
                </div>

                <div style={{
                  fontSize: '31px',
                  lineHeight: 1.1,
                  margin: '4px 0'
                }}>
                  {gwa.symbol}
                </div>

                <div style={{
                  fontSize: '11px',
                  fontWeight: 'bold'
                }}>
                  {gwa.nameHangul}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function GwaDetailView({
      gwa,
      onBack,
      toggleLearned,
      toggleFavorite
    }) {
      if (!gwa) return null;

      const upper = BAGUA_DATA[gwa.upperGwa];
      const lower = BAGUA_DATA[gwa.lowerGwa];

      return (
        <div>
          <button
            onClick={onBack}
            style={{ marginBottom: '12px', cursor: 'pointer', padding: '6px 12px', borderRadius: '4px', border: '1px solid #ccc', background: '#fff' }}
          >
            ← 64괘 목록
          </button>

          <div style={{
            border: '1px solid #ccc',
            padding: '16px',
            borderRadius: '8px'
          }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{
                fontSize: '70px',
                lineHeight: 1
              }}>
                {gwa.symbol}
              </div>

              <h2 style={{ marginBottom: '4px' }}>
                No.{gwa.id} {gwa.nameHangul}
              </h2>

              <div style={{
                fontSize: '18px',
                fontWeight: 'bold',
                marginBottom: '18px'
              }}>
                {gwa.nameHanja}
              </div>
            </div>

            <div style={{
              display: 'grid',
              gridTemplateColumns: '1fr 1fr',
              gap: '8px'
            }}>
              <div style={{
                background: '#f5f5f5',
                padding: '12px',
                borderRadius: '8px',
                textAlign: 'center'
              }}>
                <div style={{
                  fontSize: '12px',
                  color: '#666',
                  marginBottom: '6px'
                }}>
                  상괘
                </div>
                <TrigramLines item={upper} compact />
                <strong style={{ display: 'block', marginTop: '6px', fontSize: '13px' }}>
                  {upper.hanja}({upper.name}) · {upper.nature}
                </strong>
              </div>

              <div style={{
                background: '#f5f5f5',
                padding: '12px',
                borderRadius: '8px',
                textAlign: 'center'
              }}>
                <div style={{
                  fontSize: '12px',
                  color: '#666',
                  marginBottom: '6px'
                }}>
                  하괘
                </div>
                <TrigramLines item={lower} compact />
                <strong style={{ display: 'block', marginTop: '6px', fontSize: '13px' }}>
                  {lower.hanja}({lower.name}) · {lower.nature}
                </strong>
              </div>
            </div>

            <div style={{
              borderTop: '1px dashed #ccc',
              marginTop: '18px',
              paddingTop: '16px',
              color: '#888',
              fontSize: '12px'
            }}>
              괘사 · 효사 · 핵심 의미 · 해설은 공부하면서 실제 교안/자료 기준으로 채울 수 있도록 빈 필드로 두었습니다.
            </div>

            <div style={{
              display: 'flex',
              gap: '8px',
              marginTop: '16px'
            }}>
              <button
                onClick={() => toggleLearned(gwa.id)}
                style={{
                  flex: 1,
                  padding: '9px',
                  background: gwa.isLearned ? '#4CAF50' : '#ccc',
                  color: '#fff',
                  border: 'none',
                  borderRadius: '4px',
                  cursor: 'pointer'
                }}
              >
                {gwa.isLearned ? '✓ 학습 완료' : '학습 완료 표시'}
              </button>

              <button
                onClick={() => toggleFavorite(gwa.id)}
                style={{
                  flex: 1,
                  padding: '9px',
                  background: gwa.isFavorite ? '#FFB300' : '#ccc',
                  color: '#fff',
                  border: 'none',
                  borderRadius: '4px',
                  cursor: 'pointer'
                }}
              >
                {gwa.isFavorite ? '★ 즐겨찾기' : '☆ 즐겨찾기'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function QuizView({ gwaData, setUserHistory }) {
      const [quizType, setQuizType] = useState('baguaNature');
      const [question, setQuestion] = useState(null);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [result, setResult] = useState(null);

      const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
      const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];

      const makeOptions = (correct, pool) => {
        const others = shuffle([...new Set(pool.filter(x => x !== correct))]).slice(0, 3);
        return shuffle([correct, ...others]);
      };

      const getFamilyClue = (item) => {
        if (item.name === '건') return '세 효가 모두 양효인 순양(純陽)';
        if (item.name === '곤') return '세 효가 모두 음효인 순음(純陰)';

        const isMale = item.familyShort.includes('男');
        const lineName = item.highlightLine === 0
          ? '아래 초효'
          : item.highlightLine === 1
            ? '가운데 2효'
            : '위 3효';

        return `유일한 ${isMale ? '양효' : '음효'}가 ${lineName}에 있음`;
      };

      const buildQuestion = (type) => {
        const baguaList = Object.values(BAGUA_DATA);

        if (type === 'baguaNature') {
          const item = pickOne(baguaList);
          return {
            type,
            title: `${item.symbol}  ${item.hanja}(${item.name})`,
            subtitle: '이 팔괘의 자연상징은?',
            correct: item.nature,
            options: makeOptions(item.nature, baguaList.map(x => x.nature)),
            targetId: null
          };
        }

        if (type === 'natureToBagua') {
          const item = pickOne(baguaList);
          return {
            type,
            title: item.nature,
            subtitle: '이 자연상징에 해당하는 팔괘는?',
            correct: `${item.symbol} ${item.hanja}(${item.name})`,
            options: makeOptions(`${item.symbol} ${item.hanja}(${item.name})`, baguaList.map(x => `${x.symbol} ${x.hanja}(${x.name})`)),
            targetId: null
          };
        }

        if (type === 'baguaFamily') {
          const item = pickOne(baguaList);
          return {
            type,
            title: `${item.symbol}  ${item.hanja}(${item.name})`,
            subtitle: `${item.nature}의 가족 배속은?`,
            correct: item.familyShort,
            options: makeOptions(item.familyShort, baguaList.map(x => x.familyShort)),
            targetId: null
          };
        }

        if (type === 'baguaReason') {
          const item = pickOne(baguaList);
          return {
            type,
            title: `${getFamilyClue(item)}이고,\n${item.nature}을(를) 상징하는 괘의 가족 배속은?`,
            subtitle: '효의 위치와 자연상징을 함께 보고 맞혀보세요.',
            correct: item.familyShort,
            options: makeOptions(item.familyShort, baguaList.map(x => x.familyShort)),
            targetId: null
          };
        }

        if (type === 'symbolToName') {
          const gwa = pickOne(gwaData);
          const correct = `No.${gwa.id} ${gwa.nameHangul}`;
          return {
            type,
            title: gwa.symbol,
            subtitle: '이 괘의 이름은?',
            correct,
            options: makeOptions(correct, gwaData.map(g => `No.${g.id} ${g.nameHangul}`)),
            targetId: gwa.id
          };
        }

        if (type === 'nameToSymbol') {
          const gwa = pickOne(gwaData);
          return {
            type,
            title: `${gwa.nameHangul} (${gwa.nameHanja})`,
            subtitle: '이 괘의 괘상은?',
            correct: gwa.symbol,
            options: makeOptions(gwa.symbol, gwaData.map(g => g.symbol)),
            targetId: gwa.id
          };
        }

        const gwa = pickOne(gwaData);
        const upper = BAGUA_DATA[gwa.upperGwa];
        const lower = BAGUA_DATA[gwa.lowerGwa];
        const correct = `No.${gwa.id} ${gwa.nameHangul}`;
        return {
          type,
          title: `상괘 ${upper.symbol} ${upper.hanja}(${upper.name}) · ${upper.nature}`,
          subtitle: `하괘 ${lower.symbol} ${lower.hanja}(${lower.name}) · ${lower.nature}\n이 조합의 64괘는?`,
          correct,
          options: makeOptions(correct, gwaData.map(g => `No.${g.id} ${g.nameHangul}`)),
          targetId: gwa.id
        };
      };

      const newQuestion = (type = quizType) => {
        setQuestion(buildQuestion(type));
        setSelectedAnswer(null);
        setResult(null);
      };

      const changeQuizType = (e) => {
        const nextType = e.target.value;
        setQuizType(nextType);
        setQuestion(buildQuestion(nextType));
        setSelectedAnswer(null);
        setResult(null);
      };

      const submitAnswer = (answer) => {
        if (!question || selectedAnswer !== null) return;

        const isCorrect = answer === question.correct;
        setSelectedAnswer(answer);
        setResult(isCorrect ? 'correct' : 'wrong');

        setUserHistory(prev => ({
          ...prev,
          solvedCorrect: isCorrect
            ? [...prev.solvedCorrect, question.targetId ?? `bagua-${Date.now()}`]
            : prev.solvedCorrect,
          solvedWrong: !isCorrect
            ? [...prev.solvedWrong, question.targetId ?? `bagua-${Date.now()}`]
            : prev.solvedWrong,
          wrongGwaIds: !isCorrect && question.targetId
            ? [...prev.wrongGwaIds, question.targetId]
            : prev.wrongGwaIds
        }));
      };

      return (
        <div>
          <h3>팔괘 · 64괘 퀴즈</h3>

          <div style={{ marginBottom: '16px' }}>
            <label style={{
              fontSize: '12px',
              display: 'block',
              marginBottom: '4px'
            }}>
              퀴즈 유형 선택
            </label>

            <select
              value={quizType}
              onChange={changeQuizType}
              style={{ width: '100%', padding: '8px' }}
            >
              <option value="baguaNature">팔괘 → 자연상징 맞히기</option>
              <option value="natureToBagua">자연상징 → 팔괘 맞히기</option>
              <option value="baguaFamily">팔괘 → 가족 맞히기</option>
              <option value="baguaReason">효 위치 → 가족 맞히기</option>
              <option value="symbolToName">64괘 괘상 → 괘명 맞히기</option>
              <option value="nameToSymbol">64괘 괘명 → 괘상 맞히기</option>
              <option value="combination">상괘 + 하괘 → 64괘 맞히기</option>
            </select>
          </div>

          {!question ? (
            <button
              onClick={() => newQuestion()}
              style={{
                width: '100%',
                padding: '14px',
                background: '#333',
                color: '#fff',
                border: 'none',
                borderRadius: '7px',
                cursor: 'pointer',
                fontWeight: 'bold'
              }}
            >
              퀴즈 시작하기
            </button>
          ) : (
            <div style={{
              border: '1px solid #ddd',
              padding: '18px',
              textAlign: 'center',
              borderRadius: '8px'
            }}>
              <div style={{
                whiteSpace: 'pre-line',
                fontSize: question.type === 'symbolToName' ? '62px' : '20px',
                fontWeight: 'bold',
                lineHeight: 1.5,
                marginBottom: '8px'
              }}>
                {question.title}
              </div>

              <div style={{
                whiteSpace: 'pre-line',
                fontSize: '14px',
                color: '#666',
                lineHeight: 1.6,
                marginBottom: '16px'
              }}>
                {question.subtitle}
              </div>

              <div style={{ display: 'grid', gap: '8px' }}>
                {question.options.map((option) => {
                  const isChosen = selectedAnswer === option;
                  const isCorrectOption = option === question.correct;
                  let background = '#fff';
                  let border = '1px solid #ccc';

                  if (selectedAnswer !== null && isCorrectOption) {
                    background = '#e8f5e9';
                    border = '2px solid #4CAF50';
                  } else if (isChosen && result === 'wrong') {
                    background = '#ffebee';
                    border = '2px solid #e53935';
                  }

                  return (
                    <button
                      key={option}
                      onClick={() => submitAnswer(option)}
                      disabled={selectedAnswer !== null}
                      style={{
                        padding: '12px 8px',
                        background,
                        border,
                        borderRadius: '7px',
                        cursor: selectedAnswer === null ? 'pointer' : 'default',
                        fontSize: question.type === 'nameToSymbol' ? '34px' : '14px',
                        fontWeight: 'bold'
                      }}
                    >
                      {option}
                    </button>
                  );
                })}
              </div>

              {result && (
                <div style={{ marginTop: '16px' }}>
                  <div style={{
                    padding: '10px',
                    borderRadius: '6px',
                    background: result === 'correct' ? '#e8f5e9' : '#ffebee',
                    fontWeight: 'bold'
                  }}>
                    {result === 'correct'
                      ? '⭕ 정답입니다!'
                      : `❌ 오답입니다. 정답: ${question.correct}`}
                  </div>

                  <button
                    onClick={() => newQuestion()}
                    style={{
                      width: '100%',
                      marginTop: '10px',
                      padding: '11px',
                      background: '#0066cc',
                      color: '#fff',
                      border: 'none',
                      borderRadius: '6px',
                      cursor: 'pointer',
                      fontWeight: 'bold'
                    }}
                  >
                    다음 문제 →
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function HistoryView({ gwaData, userHistory }) {
      const learnedGwa = gwaData.filter(g => g.isLearned);
      const favoriteGwa = gwaData.filter(g => g.isFavorite);

      return (
        <div>
          <h3>학습 기록 및 통계</h3>

          <ul style={{
            paddingLeft: '20px',
            lineHeight: '2'
          }}>
            <li>
              공부 완료한 괘:{' '}
              <strong>{learnedGwa.length}개</strong>
            </li>
            <li>
              즐겨찾기한 괘:{' '}
              <strong>{favoriteGwa.length}개</strong>
            </li>
            <li>
              맞힌 문제 수:{' '}
              <strong>{userHistory.solvedCorrect.length}개</strong>
            </li>
            <li>
              틀린 문제 수:{' '}
              <strong>{userHistory.solvedWrong.length}개</strong>
            </li>
          </ul>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
