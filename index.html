    const generateInitial64Gwa = () =>
      HEXAGRAM_MASTER.map(([id, nameHangul, nameHanja, upperGwa, lowerGwa]) => ({
        id,
        nameHangul,
        nameHanja,
        symbol: String.fromCodePoint(0x4DC0 + id - 1),
        upperGwa,
        lowerGwa,
        meaning: COURSE_HEXAGRAM_INFO[id]?.keyword || '',
        courseText: COURSE_HEXAGRAM_INFO[id]?.courseText || '',
        quizClue: COURSE_HEXAGRAM_INFO[id]?.quizClue || '',
        sourcePage: COURSE_HEXAGRAM_INFO[id]?.sourcePage || null,
        isLearned: false,
        isFavorite: false,
        wrongCount: 0,
        gwaesa: '',
        hyosa: ['', '', '', '', '', ''],
        interpretation: '',
        memo: ''
      }));

    function TrigramLines({ item, compact = false }) {
      const displayLines = [2, 1, 0];

      return (
        <div style={{
          width: compact ? '62px' : '110px',
          margin: '0 auto',
          display: 'flex',
          flexDirection: 'column',
          gap: compact ? '5px' : '8px'
        }}>
          {displayLines.map((lineIndex) => {
            const isYang = item.lines[lineIndex] === 1;
            const highlighted = item.highlightLine === lineIndex;

            return (
              <div
                key={lineIndex}
                style={{
                  display: 'flex',
                  gap: compact ? '5px' : '8px',
                  alignItems: 'center',
                  justifyContent: 'center',
                  padding: highlighted ? '3px 5px' : '3px',
                  borderRadius: '6px',
                  background: highlighted ? '#fff3cd' : 'transparent',
                  border: highlighted ? '1px solid #f0ad4e' : '1px solid transparent'
                }}
              >
                {isYang ? (
                  <div style={{
                    height: compact ? '4px' : '6px',
                    width: '100%',
                    background: '#222',
                    borderRadius: '3px'
                  }} />
                ) : (
                  <>
                    <div style={{
                      height: compact ? '4px' : '6px',
                      width: '43%',
                      background: '#222',
                      borderRadius: '3px'
                    }} />
                    <div style={{
                      height: compact ? '4px' : '6px',
                      width: '43%',
                      background: '#222',
                      borderRadius: '3px'
                    }} />
                  </>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function App() {
      const [currentTab, setCurrentTab] = useState('home');
      const [gwaData, setGwaData] = useState(generateInitial64Gwa());
      const [selectedGwaId, setSelectedGwaId] = useState(null);

      const [userHistory, setUserHistory] = useState({
        solvedCorrect: [],
        solvedWrong: [],
        wrongGwaIds: []
      });

      const toggleLearned = (id) => {
        setGwaData(prev =>
          prev.map(item =>
            item.id === id ? { ...item, isLearned: !item.isLearned } : item
          )
        );
      };

      const toggleFavorite = (id) => {
        setGwaData(prev =>
          prev.map(item =>
            item.id === id ? { ...item, isFavorite: !item.isFavorite } : item
          )
        );
      };

      const renderContent = () => {
        switch (currentTab) {
          case 'home':
            return <HomeView setTab={setCurrentTab} gwaData={gwaData} />;
          case 'bagua':
            return <BaguaView />;
          case 'hexagrams':
            return selectedGwaId ? (
              <GwaDetailView
                gwa={gwaData.find(g => g.id === selectedGwaId)}
                onBack={() => setSelectedGwaId(null)}
                toggleLearned={toggleLearned}
                toggleFavorite={toggleFavorite}
              />
            ) : (
              <HexagramListView
                gwaData={gwaData}
                onSelectGwa={setSelectedGwaId}
              />
            );
          case 'quiz':
            return (
              <QuizView
                gwaData={gwaData}
                setUserHistory={setUserHistory}
              />
            );
          case 'history':
            return (
              <HistoryView
                gwaData={gwaData}
                userHistory={userHistory}
              />
            );
          default:
            return <HomeView setTab={setCurrentTab} gwaData={gwaData} />;
        }
      };

      return (
        <div style={{
          maxWidth: '500px',
          margin: '0 auto',
          fontFamily: 'sans-serif',
          padding: '16px',
          background: '#f9f9f9',
          minHeight: '100vh',
          boxShadow: '0 0 20px rgba(0,0,0,0.1)'
        }}>
          <header style={{
            borderBottom: '2px solid #333',
            paddingBottom: '8px',
            marginBottom: '16px'
          }}>
            <h1 style={{ fontSize: '20px', margin: 0 }}>
              ☯️ 북진의 64괘 학습 가이드
            </h1>
          </header>

          <nav style={{
            display: 'flex',
            gap: '4px',
            marginBottom: '16px',
            flexWrap: 'wrap'
          }}>
            {['home', 'bagua', 'hexagrams', 'quiz', 'history'].map((tab) => {
              const labels = {
                home: '홈',
                bagua: '팔괘 학습',
                hexagrams: '64괘 학습',
                quiz: '퀴즈',
                history: '학습기록'
              };

              return (
                <button
                  key={tab}
                  onClick={() => {
                    setCurrentTab(tab);
                    setSelectedGwaId(null);
                  }}
                  style={{
                    flex: 1,
                    padding: '8px 4px',
                    fontSize: '12px',
                    cursor: 'pointer',
                    backgroundColor: currentTab === tab ? '#333' : '#fff',
                    color: currentTab === tab ? '#fff' : '#333',
                    border: '1px solid #ccc',
                    borderRadius: '4px'
                  }}
                >
                  {labels[tab]}
                </button>
              );
            })}
          </nav>

          <main style={{
            background: '#fff',
            padding: '16px',
            borderRadius: '8px',
            border: '1px solid #ddd'
          }}>
            {renderContent()}
          </main>
        </div>
      );
    }

    function HomeView({ setTab, gwaData }) {
      const learnedCount = gwaData.filter(g => g.isLearned).length;

      return (
        <div>
          <h3>주역 공부 시작하기</h3>
          <p style={{ color: '#555', fontSize: '14px', lineHeight: '1.5' }}>
            팔괘의 원리 → 64괘 구성 → 교안의 상(象) 풀이 → 풀이로 괘 맞히기 순서로 학습합니다.
          </p>

          <div style={{
            background: '#eee',
            padding: '12px',
            borderRadius: '6px',
            margin: '16px 0'
          }}>
            <strong>64괘 현재 진도:</strong>{' '}
            {learnedCount} / {gwaData.length} 완료
            {' '}({Math.round((learnedCount / gwaData.length) * 100)}%)
          </div>

          <button
            onClick={() => setTab('bagua')}
            style={{
              width: '100%',
              padding: '12px',
              marginBottom: '8px',
              background: '#333',
              color: '#fff',
              border: 'none',
              borderRadius: '4px',
              cursor: 'pointer',
              fontWeight: 'bold'
            }}
          >
            ① 팔괘 원리부터 보기 →
          </button>

          <button
            onClick={() => setTab('hexagrams')}
            style={{
              width: '100%',
              padding: '12px',
              background: '#0066cc',
              color: '#fff',
              border: 'none',
              borderRadius: '4px',
              cursor: 'pointer',
              fontWeight: 'bold'
            }}
          >
            ② 실제 64괘 전체 보기 →
          </button>
        </div>
      );
    }

    function BaguaView() {
      const [selectedBagua, setSelectedBagua] = useState(null);

      if (selectedBagua) {
        const item = BAGUA_DATA[selectedBagua];

        return (
          <div>
            <button
              onClick={() => setSelectedBagua(null)}
              style={{ marginBottom: '12px', cursor: 'pointer', padding: '6px 12px', borderRadius: '4px', border: '1px solid #ccc', background: '#fff' }}
            >
              ← 팔괘 목록
            </button>

            <div style={{
              border: '1px solid #ddd',
              borderRadius: '10px',
              padding: '18px'
            }}>
              <div style={{ textAlign: 'center' }}>
                <div style={{ fontSize: '58px', lineHeight: 1 }}>
                  {item.symbol}
                </div>

                <h2 style={{ marginBottom: '6px' }}>
                  {item.hanja}({item.name})
                </h2>

                <div style={{ color: '#666', marginBottom: '18px' }}>
                  {item.nature} · {item.natureKr} · {item.keyword}
                </div>

                <TrigramLines item={item} />

                {item.highlightLine !== null && (
                  <div style={{
                    marginTop: '10px',
                    fontSize: '12px',
                    color: '#9a6700'
                  }}>
                    노란색으로 표시된 효가 가족 배속을 결정하는 효입니다.
                  </div>
                )}
              </div>

              <div style={{
                marginTop: '20px',
                display: 'grid',
                gap: '8px'
              }}>
                <InfoRow label="가족" value={item.family} />
                <InfoRow label="자연" value={`${item.nature} · ${item.natureKr}`} />
                <InfoRow label="오행" value={item.element} />
                <InfoRow label="방위" value={item.direction} />
                <InfoRow label="기본 의미" value={item.keyword} />
              </div>

              <div style={{
                marginTop: '16px',
                padding: '14px',
                background: '#fff8e1',
                border: '1px solid #ffe08a',
                borderRadius: '8px',
                lineHeight: 1.6
              }}>
                <strong>왜 {item.familyShort}일까?</strong>
                <div style={{ marginTop: '6px' }}>
                  {item.familyReason}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div>
          <h3>팔괘(八卦) 원리 학습</h3>

          <div style={{
            background: '#f6f6f6',
            padding: '10px',
            borderRadius: '6px',
            marginBottom: '14px',
            fontSize: '13px',
            lineHeight: 1.6
          }}>
            남자 괘는 <strong>양효 하나의 위치</strong>,
            여자 괘는 <strong>음효 하나의 위치</strong>를 보면
            長·中·少를 쉽게 구분할 수 있습니다.
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(2, 1fr)',
            gap: '8px'
          }}>
            {Object.entries(BAGUA_DATA).map(([key, item]) => (
              <button
                key={key}
                onClick={() => setSelectedBagua(key)}
                style={{
                  border: '1px solid #ddd',
                  padding: '12px 8px',
                  borderRadius: '8px',
                  textAlign: 'center',
                  background: '#fff',
                  cursor: 'pointer'
                }}
              >
                <div style={{ fontSize: '34px' }}>{item.symbol}</div>
                <div>
                  <strong>{item.hanja}({item.name})</strong>
                </div>
                <div style={{
                  fontSize: '12px',
                  color: '#555',
                  marginTop: '4px'
                }}>
                  {item.nature} · {item.natureKr}
                </div>
                <div style={{
                  fontSize: '12px',
                  marginTop: '5px',
                  fontWeight: 'bold'
                }}>
                  {item.familyShort}
                </div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function InfoRow({ label, value }) {
      return (
        <div style={{
          display: 'grid',
          gridTemplateColumns: '80px 1fr',
          gap: '8px',
          padding: '8px 10px',
          background: '#f7f7f7',
          borderRadius: '6px',
          fontSize: '14px'
        }}>
          <strong>{label}</strong>
          <span>{value}</span>
        </div>
      );
    }

    function HexagramListView({ gwaData, onSelectGwa }) {
      return (
        <div>
          <h3>주역 64괘 · 문왕괘서</h3>

          <div style={{
            fontSize: '12px',
            color: '#666',
            marginBottom: '12px'
          }}>
            임시 조합번호가 아니라 실제 1괘 乾爲天부터 64괘 火水未濟까지의 순서입니다.
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(4, 1fr)',
            gap: '8px'
          }}>
            {gwaData.map(gwa => (
              <div
                key={gwa.id}
                onClick={() => onSelectGwa(gwa.id)}
                style={{
                  border: gwa.isLearned
                    ? '2px solid #4CAF50'
                    : '1px solid #ccc',
                  padding: '8px 4px',
                  borderRadius: '6px',
                  textAlign: 'center',
                  cursor: 'pointer',
                  background: gwa.isFavorite ? '#fffde7' : '#fff'
                }}
              >
                <div style={{
                  fontSize: '10px',
                  color: '#888'
                }}>
                  No.{gwa.id}
                </div>

                <div style={{
                  fontSize: '31px',
                  lineHeight: 1.1,
                  margin: '4px 0'
                }}>
                  {gwa.symbol}
                </div>

                <div style={{
                  fontSize: '11px',
                  fontWeight: 'bold'
                }}>
                  {gwa.nameHangul}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

      onBack,
      toggleLearned,

    }) {

      const upper = BAGUA_DATA[gwa.upperGwa];
      const lower = BAGUA_DATA[gwa.lowerGwa];

      return (
        <div>
          <button
            onClick={onBack}
            style={{ marginBottom: '12px', cursor: 'pointer', padding: '6px 12px', borderRadius: '4px', border: '1px solid #ccc', background: '#fff' }}
          >
            ← 64괘 목록
          </button>

          <div style={{
            border: '1px solid #ccc',
            padding: '16px',
            borderRadius: '8px'
          }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{
                fontSize: '70px',
                lineHeight: 1
              }}>
                {gwa.symbol}
              </div>

              <h2 style={{ marginBottom: '4px' }}>
                No.{gwa.id} {gwa.nameHangul}
              </h2>

              <div style={{
                fontSize: '18px',
                fontWeight: 'bold',
                marginBottom: '18px'
              }}>
                {gwa.nameHanja}
              </div>
            </div>

            <div style={{
              display: 'grid',
              gridTemplateColumns: '1fr 1fr',
              gap: '8px'
            }}>
              <div style={{
                background: '#f5f5f5',
                padding: '12px',
                borderRadius: '8px',
                textAlign: 'center'
              }}>
                <div style={{
                  fontSize: '12px',
                  color: '#666',
                  marginBottom: '6px'
                }}>

                <TrigramLines item={upper} compact />
                <strong style={{ display: 'block', marginTop: '6px', fontSize: '13px' }}>
                  {upper.hanja}({upper.name}) · {upper.nature}
                </strong>
              </div>

              <div style={{
                background: '#f5f5f5',
                padding: '12px',
                borderRadius: '8px',
                textAlign: 'center'
              }}>
                <div style={{
                  fontSize: '12px',
                  color: '#666',
                  marginBottom: '6px'
                }}>
                  하괘
                </div>
                <TrigramLines item={lower} compact />
                <strong style={{ display: 'block', marginTop: '6px', fontSize: '13px' }}>
                  {lower.hanja}({lower.name}) · {lower.nature}
                </strong>
              </div>
            </div>

            <div style={{
              marginTop: '18px',

            }}>
              <div style={{ fontSize: '12px', color: '#356', marginBottom: '5px' }}>상수역학 교안 · 6주 상(象) 읽기</div>

              <div style={{ marginTop: '10px', fontSize: '14px', whiteSpace: 'pre-line' }}>

              marginTop: '12px',

              display: 'flex',
              gap: '8px',
              marginTop: '16px'
            }}>
              <button
                onClick={() => toggleLearned(gwa.id)}
                style={{
                  flex: 1,
                  padding: '9px',
                  background: gwa.isLearned ? '#4CAF50' : '#ccc',
                  color: '#fff',
                  border: 'none',
                  borderRadius: '4px',
                  cursor: 'pointer'
                }}
              >
                {gwa.isLearned ? '✓ 학습 완료' : '학습 완료 표시'}
              </button>

              <button
                onClick={() => toggleFavorite(gwa.id)}
                style={{
                  flex: 1,
                  padding: '9px',
                  background: gwa.isFavorite ? '#FFB300' : '#ccc',
                  color: '#fff',
                  border: 'none',
                  borderRadius: '4px',
                  cursor: 'pointer'
                }}
              >
                {gwa.isFavorite ? '★ 즐겨찾기' : '☆ 즐겨찾기'}
              </button>
            </div>
          </div>
        </div>
      );
    }


    function QuizView({ gwaData, setUserHistory }) {
      const [quizType, setQuizType] = useState('baguaFamily');
      const [question, setQuestion] = useState(null);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [result, setResult] = useState(null);
      const [score, setScore] = useState({ correct: 0, total: 0 });

      const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

      const makeQuestion = (type) => {
        setSelectedAnswer(null);
        setResult(null);

        // 1) 팔괘 → 가족 맞히기
        if (type === 'baguaFamily') {
          const entries = Object.entries(BAGUA_DATA);
          const [key, item] = entries[Math.floor(Math.random() * entries.length)];
          const options = shuffle(
            entries
              .map(([k, v]) => ({ value: k, label: v.familyShort }))
          ).slice(0, 4);

          // 정답이 4개 안에 없을 경우 보정
          if (!options.some(o => o.value === key)) {
            options[0] = { value: key, label: item.familyShort };
          }

          setQuestion({
            type,
            title: `${item.symbol} ${item.hanja}(${item.name})의 가족 배속은?`,
            sub: item.nature,
            correct: key,
            correctLabel: item.familyShort,
            explanation: item.familyReason,
            options: shuffle(options)
          });
          return;
        }

        // 2) 효 위치 → 가족 맞히기
        if (type === 'baguaReason') {
          const candidates = Object.entries(BAGUA_DATA).filter(
            ([, item]) => item.highlightLine !== null
          );
          const [key, item] = candidates[Math.floor(Math.random() * candidates.length)];
          const lineNames = ['아래(초효)', '가운데(2효)', '위(3효)'];
          const yinYang = item.lines[item.highlightLine] === 1 ? '양효' : '음효';

          const optionPool = candidates.map(([k, v]) => ({
            value: k,
            label: v.familyShort
          }));
          let options = shuffle(optionPool).slice(0, 4);
          if (!options.some(o => o.value === key)) {
            options[0] = { value: key, label: item.familyShort };
          }

          setQuestion({
            type,
            title: `${lineNames[item.highlightLine]}에 유일한 ${yinYang}가 있는 괘의 가족 배속은?`,
            sub: '효의 위치와 음양을 보고 맞혀보세요.',
            correct: key,
            correctLabel: item.familyShort,
            explanation: item.familyReason,
            options: shuffle(options)
          });
          return;
        }

        // 아래부터는 64괘 문제
        const gwa = gwaData[Math.floor(Math.random() * gwaData.length)];

        // 3) 괘상 → 괘명
        if (type === 'symbolToName') {
          const distractors = shuffle(gwaData.filter(g => g.id !== gwa.id)).slice(0, 3);
          const options = shuffle([
            { value: gwa.id, label: `${gwa.nameHangul} (${gwa.nameHanja})` },
            ...distractors.map(g => ({
              value: g.id,
              label: `${g.nameHangul} (${g.nameHanja})`
            }))
          ]);

          setQuestion({
            type,
            title: `이 괘상의 이름은?`,
            symbol: gwa.symbol,
            sub: `No.${gwa.id}`,
            correct: gwa.id,
            correctLabel: `${gwa.nameHangul} (${gwa.nameHanja})`,
            explanation: `정답은 ${gwa.nameHangul} (${gwa.nameHanja})입니다. 상괘는 ${BAGUA_DATA[gwa.upperGwa].hanja}(${gwa.upperGwa}), 하괘는 ${BAGUA_DATA[gwa.lowerGwa].hanja}(${gwa.lowerGwa})입니다.`,
            options
          });
          return;
        }

        // 4) 괘명 → 괘상
        if (type === 'nameToSymbol') {
          const distractors = shuffle(gwaData.filter(g => g.id !== gwa.id)).slice(0, 3);
          const options = shuffle([
            { value: gwa.id, label: gwa.symbol },
            ...distractors.map(g => ({
              value: g.id,
              label: g.symbol
            }))
          ]);

          setQuestion({
            type,
            title: `${gwa.nameHangul} (${gwa.nameHanja})의 괘상은?`,
            sub: `No.${gwa.id}`,
            correct: gwa.id,
            correctLabel: gwa.symbol,
            explanation: `${gwa.nameHangul}은 상괘 ${BAGUA_DATA[gwa.upperGwa].hanja}(${gwa.upperGwa}), 하괘 ${BAGUA_DATA[gwa.lowerGwa].hanja}(${gwa.lowerGwa})의 조합입니다.`,
            options
          });
          return;
        }

        // 5) 교안 풀이 → 어느 괘인지 맞히기
        // 교안 원문에서 한자·효 표기는 그대로 살리고, 정답 괘명만 가린다.
        if (type === 'interpretationToName') {
          const candidates = gwaData.filter(g => g.courseText);
          const target = candidates[Math.floor(Math.random() * candidates.length)];
          const distractors = shuffle(candidates.filter(g => g.id !== target.id)).slice(0, 3);
          const options = shuffle([
            { value: target.id, label: `${target.nameHangul} (${target.nameHanja})` },
            ...distractors.map(g => ({ value: g.id, label: `${g.nameHangul} (${g.nameHanja})` }))
          ]);

          const getAnswerTerm = (gwa) => {
            const doubled = [1, 2, 29, 30, 51, 52, 57, 58];
            if (doubled.includes(gwa.id)) {
              return BAGUA_DATA[gwa.upperGwa].hanja;
            }
            return gwa.nameHanja.slice(2);
          };

          const buildExactCourseClue = (gwa) => {
            const term = getAnswerTerm(gwa);
            const sentences = gwa.courseText
              .split(/(?<=[.!?])\s+/)
              .map(v => v.trim())
              .filter(Boolean);

            // 첫 문장은 대개 '○○은 ~의 뜻'이라 정답이 바로 드러나므로 제외하고,
            // 뒤의 실제 괘상 설명을 2~3문장 사용한다.
            let selected = sentences.slice(1, 4).join(' ');
            if (!selected) selected = gwa.courseText;

            // 너무 짧으면 한 문장 더 붙인다.
            if (selected.length < 90 && sentences[4]) {
              selected += ' ' + sentences[4];
            }

            // 정답 괘명 자체만 □□로 가리고, 乾·坤·震·坎·효명·한자는 보존한다.
            if (term) {
              selected = selected.split(term).join('□□');
            }

            return selected;
          };

          setQuestion({
            type,
            title: '다음 교안의 괘상 풀이에 해당하는 괘는?',
            sub: buildExactCourseClue(target),
            correct: target.id,
            correctLabel: `${target.nameHangul} (${target.nameHanja})`,
            explanation: `No.${target.id} ${target.nameHangul} (${target.nameHanja}) — 핵심 상의(象意): ${target.meaning}. 교안 p.${target.sourcePage}`,
            options
          });
          return;
        }

        // 6) 상괘 + 하괘 → 64괘
        if (type === 'combination') {
          const distractors = shuffle(gwaData.filter(g => g.id !== gwa.id)).slice(0, 3);
          const options = shuffle([
            { value: gwa.id, label: `${gwa.nameHangul} (${gwa.nameHanja})` },
            ...distractors.map(g => ({
              value: g.id,
              label: `${g.nameHangul} (${g.nameHanja})`
            }))
          ]);

          setQuestion({
            type,
            title: `상괘 ${BAGUA_DATA[gwa.upperGwa].symbol} ${BAGUA_DATA[gwa.upperGwa].hanja}(${gwa.upperGwa}) + 하괘 ${BAGUA_DATA[gwa.lowerGwa].symbol} ${BAGUA_DATA[gwa.lowerGwa].hanja}(${gwa.lowerGwa})`,
            sub: '이 조합에 해당하는 64괘는?',
            correct: gwa.id,
            correctLabel: `${gwa.nameHangul} (${gwa.nameHanja})`,
            explanation: `정답은 No.${gwa.id} ${gwa.nameHangul} (${gwa.nameHanja})입니다.`,
            options
          });
        }
      };

      const submitAnswer = (value) => {
        if (!question || selectedAnswer !== null) return;

        setSelectedAnswer(value);
        const isCorrect = value === question.correct;
        setResult(isCorrect ? 'correct' : 'wrong');

        setScore(prev => ({
          correct: prev.correct + (isCorrect ? 1 : 0),
          total: prev.total + 1
        }));

        setUserHistory(prev => ({
          ...prev,
          solvedCorrect: isCorrect
            ? [...prev.solvedCorrect, question.correct]
            : prev.solvedCorrect,
          solvedWrong: !isCorrect
            ? [...prev.solvedWrong, question.correct]
            : prev.solvedWrong,
          wrongGwaIds:
            !isCorrect && typeof question.correct === 'number'
              ? [...new Set([...prev.wrongGwaIds, question.correct])]
              : prev.wrongGwaIds
        }));
      };

      React.useEffect(() => {
        makeQuestion(quizType);
      }, [quizType]);

      const typeLabels = {
        baguaFamily: '팔괘 → 가족 맞히기',
        baguaReason: '효 위치 → 가족 맞히기',
        symbolToName: '64괘 괘상 → 괘명 맞히기',
        nameToSymbol: '64괘 괘명 → 괘상 맞히기',
        interpretationToName: '교안 풀이 → 괘 맞히기',
        combination: '상괘 + 하괘 → 64괘 맞히기'
      };

      return (
        <div>
          <h3>64괘 · 괘상 읽기 퀴즈</h3>

          <div style={{
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            marginBottom: '12px',
            fontSize: '13px'
          }}>
            <strong>{typeLabels[quizType]}</strong>
            <span>점수: {score.correct} / {score.total}</span>
          </div>

          <select
            value={quizType}
            onChange={(e) => {
              setQuizType(e.target.value);
              setScore({ correct: 0, total: 0 });
            }}
            style={{
              width: '100%',
              padding: '9px',
              marginBottom: '14px',
              borderRadius: '6px',
              border: '1px solid #ccc'
            }}
          >
            <option value="baguaFamily">팔괘 → 가족 맞히기</option>
            <option value="baguaReason">효 위치 → 가족 맞히기</option>
            <option value="symbolToName">64괘 괘상 → 괘명 맞히기</option>
            <option value="nameToSymbol">64괘 괘명 → 괘상 맞히기</option>
            <option value="interpretationToName">교안 풀이 → 괘 맞히기</option>
            <option value="combination">상괘 + 하괘 → 64괘 맞히기</option>
          </select>

          {question && (
            <div style={{
              border: '1px solid #ddd',
              padding: '18px',
              borderRadius: '10px',
              background: '#fff'
            }}>
              {question.symbol && (
                <div style={{
                  textAlign: 'center',
                  fontSize: '78px',
                  lineHeight: 1,
                  marginBottom: '14px'
                }}>
                  {question.symbol}
                </div>
              )}

              <div style={{
                textAlign: 'center',
                fontSize: '17px',
                fontWeight: 'bold',
                lineHeight: 1.5,
                marginBottom: '5px'
              }}>
                {question.title}
              </div>

              <div style={{
                textAlign: 'center',
                fontSize: '12px',
                color: '#777',
                marginBottom: '16px'
              }}>
                {question.sub}
              </div>

              <div style={{
                display: 'grid',
                gridTemplateColumns:
                  question.type === 'nameToSymbol' ? 'repeat(2, 1fr)' : '1fr',
                gap: '8px'
              }}>
                {question.options.map((opt) => {
                  const answered = selectedAnswer !== null;
                  const isCorrectOption = opt.value === question.correct;
                  const isSelected = opt.value === selectedAnswer;

                  let bg = '#fff';
                  let border = '1px solid #ccc';

                  if (answered && isCorrectOption) {
                    bg = '#e8f5e9';
                    border = '2px solid #4CAF50';
                  } else if (answered && isSelected && !isCorrectOption) {
                    bg = '#ffebee';
                    border = '2px solid #e53935';
                  }

                  return (
                    <button
                      key={String(opt.value)}
                      onClick={() => submitAnswer(opt.value)}
                      disabled={answered}
                      style={{
                        padding: question.type === 'nameToSymbol' ? '18px 10px' : '11px',
                        fontSize: question.type === 'nameToSymbol' ? '38px' : '14px',
                        border,
                        borderRadius: '7px',
                        background: bg,
                        cursor: answered ? 'default' : 'pointer',
                        textAlign: 'center'
                      }}
                    >
                      {opt.label}
                    </button>
                  );
                })}
              </div>

              {result && (
                <div style={{
                  marginTop: '14px',
                  padding: '12px',
                  borderRadius: '7px',
                  background: result === 'correct' ? '#e8f5e9' : '#ffebee',
                  lineHeight: 1.6,
                  fontSize: '13px'
                }}>
                  <strong>
                    {result === 'correct' ? '정답! ✓' : `오답 · 정답은 ${question.correctLabel}`}
                  </strong>
                  <div style={{ marginTop: '5px' }}>
                    {question.explanation}
                  </div>
                </div>
              )}

              <button
                onClick={() => makeQuestion(quizType)}
                style={{
                  width: '100%',
                  marginTop: '14px',
                  padding: '11px',
                  border: 'none',
                  borderRadius: '6px',
                  background: '#333',
                  color: '#fff',
                  fontWeight: 'bold',
                  cursor: 'pointer'
                }}
              >
                다음 문제 →
              </button>
            </div>
          )}
        </div>
      );
    }

    function HistoryView({ gwaData, userHistory }) {
      const learnedGwa = gwaData.filter(g => g.isLearned);
      const favoriteGwa = gwaData.filter(g => g.isFavorite);

      return (
        <div>
          <h3>학습 기록 및 통계</h3>

          <ul style={{
            paddingLeft: '20px',
            lineHeight: '2'
          }}>
            <li>
              공부 완료한 괘:{' '}
              <strong>{learnedGwa.length}개</strong>
            </li>
            <li>
              즐겨찾기한 괘:{' '}
              <strong>{favoriteGwa.length}개</strong>
            </li>
            <li>
              맞힌 문제 수:{' '}
              <strong>{userHistory.solvedCorrect.length}개</strong>
            </li>
            <li>
              틀린 문제 수:{' '}
              <strong>{userHistory.solvedWrong.length}개</strong>
            </li>
          </ul>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
